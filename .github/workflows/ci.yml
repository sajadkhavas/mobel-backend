name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Django checks
        run: python manage.py check --settings=config.settings.test
      - name: Tests
        run: pytest

  postgres-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mobel
          POSTGRES_USER: mobel
          POSTGRES_PASSWORD: mobel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mobel -d mobel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ci-production-secret-key-not-for-real-use
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: postgresql
      DB_NAME: mobel
      DB_USER: mobel
      DB_PASSWORD: mobel
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Production configuration check
        run: python manage.py check --settings=config.settings.production --deploy
      - name: Migrate PostgreSQL
        run: python manage.py migrate --noinput --settings=config.settings.production
      - name: Database and Redis smoke test
        run: |
          python manage.py shell --settings=config.settings.production -c 'from django.db import connection; from django.core.cache import cache; c=connection.cursor(); c.execute("SELECT 1"); assert c.fetchone()==(1,); cache.set("ci","ok",10); assert cache.get("ci")=="ok"'
